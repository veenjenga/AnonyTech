# Redis configuration for e-voting session cache
# AOF (Append-Only File) enabled for millisecond-granularity recovery

appendonly yes
appendfilename "evoting.aof"
appendfsync everysec          # fsync every second — balance of safety vs perf
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes

# Persistence: also keep RDB snapshots as a backup
save 900 1
save 300 10
save 60  10000

# Memory policy: never evict (votes must not be silently dropped)
maxmemory-policy noeviction

# Logging
loglevel notice
logfile ""

# Bind to all interfaces inside container
bind 0.0.0.0
protected-mode no
